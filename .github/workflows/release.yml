name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: forgels
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: forgels
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: forgels.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked -p forgels --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          staged="forgels-${{ matrix.target }}"
          mkdir -p "$staged"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$staged/"
          cp README.md "$staged/" 2>/dev/null || true
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            (cd "$staged" && 7z a "../$staged.zip" .)
            echo "ASSET=$staged.zip" >> "$GITHUB_ENV"
          else
            tar -czf "$staged.tar.gz" "$staged"
            echo "ASSET=$staged.tar.gz" >> "$GITHUB_ENV"
          fi

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
