name: Feature request
description: Ask for language support or server capabilities.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should happen, with an example if possible.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - solidity
        - noir
        - transport
        - diagnostics
        - config
        - docs
        - other
    validations:
      required: true
