[workspace]
members = [
  "crates/fls",
  "crates/forgels-core",
  "crates/forgels-protocol",
  "crates/forgels-syntax",
  "crates/forgels-common",
  "crates/forgels-fmt",
  "crates/forgels-lint",
  "crates/forgels-lang-solidity",
  "crates/forgels-lang-noir",
]
resolver = "2"

[workspace.package]
version = "0.2.0-beta"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/forgels/forgels"
authors = ["ForgeLS Contributors"]

[workspace.dependencies]
fls = { path = "crates/fls" }
forgels-core = { path = "crates/forgels-core" }
forgels-protocol = { path = "crates/forgels-protocol" }
forgels-syntax = { path = "crates/forgels-syntax" }
forgels-common = { path = "crates/forgels-common" }
forgels-fmt = { path = "crates/forgels-fmt" }
forgels-lint = { path = "crates/forgels-lint" }
forgels-lang-solidity = { path = "crates/forgels-lang-solidity" }
forgels-lang-noir = { path = "crates/forgels-lang-noir" }
serde_json = "1"
toml = "1"
glob = "0.3"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
